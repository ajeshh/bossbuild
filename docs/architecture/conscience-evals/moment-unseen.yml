# Conscience eval set — moment: focus, via the unseen loops (unseen-loop, unseen-since-loop)
# Loop specs: stages/L0-quickstart/template/.boss/loops/unseen-loop.md, unseen-since-loop.md
# Detector: docs/architecture/conscience-evals/runner.js
#
# The build has outrun the evidence. focus-loop reads the BOARD and cannot open for a founder who
# writes no FEATs; these two read the BUILD. unseen-loop: about 1,500+ lines of $source and no
# EVID at all. unseen-since-loop: six or more $source files changed after the newest EVID.
#
# SCOPE — predicate-gate only. Whether the recent work is many things started (speak) or one
# thing getting deeper (stay silent) is the model's judgment in the live turn. These cases carry
# no FEATs, canvas or devlog, so only the unseen loops can open — clean isolation. `age_days`
# backdates a file's mtime; unseen-since compares dates, so its cases need it.

# =============================================================================
# SHOULD FIRE
# =============================================================================

- id: m-unseen-001
  category: should-fire
  scenario: "A runaway build: ~1,600 lines of source and nobody outside has been recorded seeing any of it."
  project_state:
    src_files:
      - { path: src/app.js, fixture: source_1600_lines }
  expected_detection:
    fires: true
    moment: focus
  why: "unseen-loop entry met (1,600 lines ≥ 1,500, zero EVID); exit unmet (no EVID)."

- id: m-unseen-002
  category: should-fire
  scenario: "Someone saw it once; six source files have changed since."
  project_state:
    src_files:
      - { path: src/a.js, fixture: app_source }
      - { path: src/b.js, fixture: app_source }
      - { path: src/c.js, fixture: app_source }
      - { path: src/d.js, fixture: app_source }
      - { path: src/e.js, fixture: app_source }
      - { path: src/f.js, fixture: app_source }
    docs_files:
      - { path: docs/evidence/EVID-001-first-look.md, fixture: evid_stated_pain, age_days: 5 }
  expected_detection:
    fires: true
    moment: focus
  why: "unseen-since-loop entry met (6 source files newer than the newest EVID)."

# =============================================================================
# SHOULD NOT FIRE
# =============================================================================

- id: m-unseen-003
  category: should-not-fire
  scenario: "A starter app — 300 lines, no evidence yet. Too early to ask who has seen it."
  project_state:
    src_files:
      - { path: src/app.js, fixture: source_300_lines }
  expected_detection:
    fires: false
  why: "Below the 1,500-line gate. A fresh scaffold must never trip this."

- id: m-unseen-004
  category: should-not-fire
  scenario: "A big build, and the newest evidence is newer than every source file."
  project_state:
    src_files:
      - { path: src/app.js, fixture: source_1600_lines, age_days: 3 }
    docs_files:
      - { path: docs/evidence/EVID-001-tried-it.md, fixture: evid_commitment }
  expected_detection:
    fires: false
  why: "unseen-loop closed (an EVID exists); unseen-since entry unmet (nothing changed after it)."

- id: m-unseen-005
  category: should-not-fire
  scenario: "Five source files changed since the last evidence — one under the gate."
  project_state:
    src_files:
      - { path: src/a.js, fixture: app_source }
      - { path: src/b.js, fixture: app_source }
      - { path: src/c.js, fixture: app_source }
      - { path: src/d.js, fixture: app_source }
      - { path: src/e.js, fixture: app_source }
    docs_files:
      - { path: docs/evidence/EVID-001-first-look.md, fixture: evid_stated_pain, age_days: 5 }
  expected_detection:
    fires: false
  why: "5 < 6. The threshold is a guess to tune, and this pins where it sits today."

- id: m-unseen-006
  category: should-not-fire
  scenario: "A runaway build in a folder BOSS doesn't watch (server/) — blind, so quiet."
  project_state:
    src_files:
      - { path: server/app.js, fixture: source_1600_lines }
  expected_detection:
    fires: false
  why: "$source resolves to zero files: BOSS is looking in the wrong place and has no standing to speak. `boss conscience` reports it as not evaluated."
